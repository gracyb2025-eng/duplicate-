{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - NYONDO Hardware</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a; /* soft black */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .login-wrapper {
      display: flex;
      width: 800px;
      height: 400px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .logo-container {
      flex: 1;
      background-color: #1a1a1a; /* same as body */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-container img {
      width: 200px;
    }
    .form-container {
      flex: 1;
      background-color: #f9f9f9;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .form-container h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .form-container label {
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
    }
    .form-container input {
      margin-bottom: 20px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
    }
    .form-container button {
      padding: 12px;
      background-color: #2B5DB0;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    .form-container button:hover {
      background-color: #1f3f7a;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <!-- Logo container -->
    <div class="logo-container">
      <img src="{% static 'images/logo.png' %}" alt="NYONDO Hardware Logo">
    </div>

    <!-- Login form container -->
    <div class="form-container">
      <h1>Login</h1>
      <form method="post">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
      </form>
    </div>
  </div>
</body>
</html>

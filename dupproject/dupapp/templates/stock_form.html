{% extends "base_stock.html" %}
{% block content %}

<style>
  /* Main container */
  .stock-container {
    background: #fff;
    border-radius: 12px;
    margin: 40px auto;
    max-width: 900px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  /* Black header strip */
  .stock-header {
    background-color: #000;
    color: #fff;
    text-align: center;
    padding: 15px;
    font-size: 1.4rem;
    font-weight: 600;
  }

  /* Form body */
  .stock-body {
    padding: 25px;
  }

  /* Button hover effects */
  .btn-success, .btn-danger {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-success:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(0, 128, 0, 0.3);
  }
  .btn-danger:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
  }
</style>

<div class="stock-container">
  <!-- Black heading line -->
  <div class="stock-header">
    Add New Stock
  </div>

  <!-- Form body -->
  <div class="stock-body">
    <form method="POST">
      {% csrf_token %}
      <div class="row">
        <!-- Left Column -->
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label">Item Name</label>
            <input type="text" name="item_name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Specification (Size/Grade/Type)</label>
            <input type="text" name="specification" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Units Received</label>
            <input type="number" name="quantity" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Unit Cost</label>
            <input type="number" step="0.01" name="unit_cost" class="form-control" required>
          </div>
        </div>

        <!-- Right Column -->
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label">Selling Price</label>
            <input type="number" step="0.01" name="selling_price" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Supplier</label>
            <select name="supplier" class="form-select" required>
              {% for supplier in suppliers %}
                <option value="{{ supplier.id }}">{{ supplier.name }}</option>
              {% endfor %}
            </select>
            <!-- Add Supplier Button -->
            <a href="{% url 'add_supplier' %}" class="btn btn-outline-primary btn-sm mt-2">
              <i class="fas fa-user-plus"></i> Add New Supplier
            </a>
          </div>

          <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <select name="payment_method" class="form-select" required>
              <option value="Cash">Cash</option>
              <option value="Credit">Credit</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Amount Paid (if any)</label>
            <input type="number" step="0.01" name="amount_paid" class="form-control">
          </div>
        </div>
      </div>

      <!-- Submit and Cancel Buttons -->
      <div class="d-flex justify-content-center mt-4">
        <button type="submit" class="btn btn-success me-3">
          <i class="fas fa-save"></i> Save Stock
        </button>
        <a href="{% url 'stock_dashboard' %}" class="btn btn-danger">
          <i class="fas fa-times-circle"></i> Cancel
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}

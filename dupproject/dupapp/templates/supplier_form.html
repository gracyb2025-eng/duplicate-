{% extends 'base_admin.html' %}
{% block content %}

<style>
  /* Main container */
  .supplier-container {
    background: #fff;
    border-radius: 12px;
    margin: 40px auto;
    max-width: 900px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  /* Black header strip */
  .supplier-header {
    background-color: #000;
    color: #fff;
    text-align: center;
    padding: 15px;
    font-size: 1.4rem;
    font-weight: 600;
  }

  /* Form body */
  .supplier-body {
    padding: 25px;
  }

  /* Button hover effects */
  .btn-success, .btn-danger {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-success:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(0, 128, 0, 0.3);
  }
  .btn-danger:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
  }
</style>

<div class="supplier-container">
  <!-- Black heading line -->
  <div class="supplier-header">
    Add New Supplier
  </div>

  <!-- Form body -->
  <div class="supplier-body">
    <form method="POST">
      {% csrf_token %}
      <div class="row">
        <!-- Left Column -->
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label">Supplier Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
        </div>

        <!-- Right Column -->
        <div class="col-md-6">
          <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" name="contact" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" name="address" class="form-control">
          </div>
        </div>
      </div>

      <!-- Row with NIN and Buttons -->
      <div class="row mt-3">
        <!-- NIN field -->
        <div class="col-md-6 mb-3">
          <label class="form-label">NIN</label>
          <input type="text" name="nin" class="form-control" placeholder="Enter National ID Number">
        </div>

        <!-- Buttons -->
        <div class="col-md-6 mb-3 d-flex align-items-end justify-content-end">
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
              <i class="fas fa-save"></i> Save Supplier
            </button>
            <a href="{% url 'stock_dashboard' %}" class="btn btn-danger">
              <i class="fas fa-times-circle"></i> Cancel
            </a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

{% endblock %}

{% extends "base_admin.html" %}
{% block content %}
<style>
  /* Card styling */
  .edit-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    max-width: 650px;
    margin: auto;
    overflow: hidden;
  }

  /* Card header */
  .edit-card-header {
    background-color: #000; /* black line */
    color: #fff;
    padding: 15px;
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
  }

  /* Button hover effects */
  .btn-success:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(0, 128, 0, 0.3);
  }
  .btn-danger:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
  }
</style>

<div class="container mt-5 pt-5">
  <div class="edit-card">
    <!-- Heading inside card -->
    <div class="edit-card-header">
      Edit Sale
    </div>

    <div class="p-4">
      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <!-- NIN field -->
        <div class="mb-3">
          <label class="form-label">NIN</label>
          <input type="text" name="nin" class="form-control" placeholder="Enter National ID Number">
        </div>

        <!-- Buttons centered below -->
        <div class="d-flex justify-content-center mt-3">
          <!-- Save button in green -->
          <button type="submit" class="btn btn-success me-3">
            <i class="fas fa-check-circle"></i> Save Changes
          </button>

          <!-- Cancel button in red -->
          <a href="{% url 'admin_sales_dashboard' %}" class="btn btn-danger">
            <i class="fas fa-times-circle"></i> Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

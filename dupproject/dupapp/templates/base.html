<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>NYONDO Hardware</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <style>

    body{
      background-color:#f8f9fa;
    }

    /* Sidebar */
    .offcanvas{
      background-color:#212529;
      color:#fff;
    }

    .offcanvas-header{
      border-bottom:1px solid #444;
    }

    .offcanvas .btn-close{
      filter:invert(1);
    }

    .offcanvas-body{
      padding:20px;
      display:flex;
      flex-direction:column;
      height:100%;
    }

    .offcanvas-body h5{
      color:#fff;
      text-align:center;
      margin-bottom:20px;
      font-weight:bold;
    }

    .offcanvas-body .list-group{
      flex-grow:1;
    }

    .offcanvas-body .list-group-item{
      background:transparent;
      border:none;
      margin-bottom:10px;
      border-radius:8px;
      transition:0.2s;
    }

    .offcanvas-body .list-group-item:hover{
      background:#343a40;
      transform:translateX(5px);
    }

    .offcanvas-body .list-group-item a{
      text-decoration:none;
      color:#fff;
      display:flex;
      align-items:center;
      font-weight:500;
    }

    .offcanvas-body .list-group-item a i{
      margin-right:10px;
      color:#0d6efd;
    }

    /* Navbar */
    .navbar{
      background-color:#212529 !important;
    }

    .navbar-brand{
      font-weight:bold;
      letter-spacing:1px;
    }

    /* Buttons */
    .btn{
      transition:0.2s;
    }

    .btn:hover{
      transform:scale(1.03);
    }

    /* Profile section */
    .profile-section{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding-top:20px;
      border-top:1px solid #444;
      margin-top:auto;
      color:#fff;
    }

    .profile-circle{
      width:40px;
      height:40px;
      border-radius:50%;
      background:#fff;
      color:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      font-weight:bold;
    }

    /* Footer */
    footer{
      background-color:#212529;
      color:#fff;
      text-align:center;
      padding:15px 0;
      margin-top:40px;
    }

  </style>

</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark">

    <div class="container-fluid">

      <a class="navbar-brand"
         href="{% url 'admin_dashboard' %}">
         NYONDO Hardware
      </a>

      <button class="btn btn-outline-light"
              type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#mainMenu">

        <i class="fas fa-bars"></i>

      </button>

    </div>

  </nav>

  <!-- Sidebar -->
  <div class="offcanvas offcanvas-start"
       tabindex="-1"
       id="mainMenu">

    <div class="offcanvas-header">

      <h5 class="offcanvas-title">
        Menu
      </h5>

      <button type="button"
              class="btn-close text-reset"
              data-bs-dismiss="offcanvas">
      </button>

    </div>

    <div class="offcanvas-body">

      <h5>NYONDO GENERAL HARDWARE LTD</h5>

      <ul class="list-group">

        <li class="list-group-item">
          <a href="{% url 'admin_dashboard' %}">
            <i class="fas fa-home"></i>
            Dashboard
          </a>
        </li>

        <li class="list-group-item">
          <a href="{% url 'sales_dashboard' %}">
            <i class="fas fa-shopping-cart"></i>
            Sales
          </a>
        </li>

        <li class="list-group-item">
          <a href="{% url 'stock_dashboard' %}">
            <i class="fas fa-boxes"></i>
            Stock
          </a>
        </li>

        <li class="list-group-item">
          <a href="{% url 'reports' %}">
            <i class="fas fa-chart-line"></i>
            Reports
          </a>
        </li>

        <li class="list-group-item">
          <a href="{% url 'supplier_list' %}">
            <i class="fas fa-truck"></i>
            Suppliers
          </a>
        </li>

        <li class="list-group-item">
          <a href="{% url 'deposit_list' %}">
            <i class="fas fa-money-bill-wave"></i>
            Deposits
          </a>
        </li>

      </ul>

      <!-- Profile -->
      <div class="profile-section">

        <div class="profile-circle">
          G
        </div>

        <span>Gracy</span>

      </div>

    </div>

  </div>

  <!-- Main Content -->
  <div class="container mt-4">

    {% block content %}
    {% endblock %}

  </div>

  <!-- Footer -->
  <footer>

    <p class="mb-1">
      NYONDO GENERAL HARDWARE LTD
    </p>

    <p class="mb-1">
      Location: Nansana, Uganda
    </p>

    <p class="mb-0">
      &copy; 2026 NYONDO General Hardware LTD.
    </p>

  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

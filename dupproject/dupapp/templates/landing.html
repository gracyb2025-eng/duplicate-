{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NYONDO Hardware</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url("{% static 'images/defi.png' %}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed; /* keeps background fixed even when scrolling */
      height: 100vh;
    }

    .logo {
      text-align: center;
      padding-top: 100px;
    }

    .logo img {
      width: 250px;
      opacity: 0;
      animation: fadeIn 2s ease forwards; /* logo fade-in only */
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .business-statement {
      text-align: center;
      margin-top: 20px;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    .btn-start {
      display: block;
      margin: 30px auto;
      padding: 12px 24px;
      font-size: 1.2rem;
      background-color: #2B5DB0;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-start:hover {
      background-color: #1f3f7a;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="{% static 'images/logo.png' %}" alt="NYONDO Hardware Logo">
  </div>

  <div class="business-statement">
    Reliable hardware solutions for every project
  </div>

  <a href="{% url 'login' %}">
    <button class="btn-start">Get Started</button>
  </a>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register User - NYONDO Hardware</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;

            /* background-image: url("{% static 'images/defi.png' %}"); */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-wrapper{
            width:850px;
            height:500px;
            display:flex;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 8px 25px rgba(0,0,0,0.5);
            background:rgba(255,255,255,0.95);
        }

        .left-side{
            flex:1;
            background:#111;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .left-side img{
            width:220px;
        }

        .right-side{
            flex:1;
            padding:40px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .right-side h2{
            text-align:center;
            margin-bottom:30px;
            font-size:40px;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        .form-group input,
        .form-group select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        .register-btn{
            width:100%;
            padding:12px;
            background:#2B5DB0;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:17px;
            font-weight:bold;
        }

        .register-btn:hover{
            background:#1d4687;
        }

        .success-message{
            background:green;
            color:white;
            padding:10px;
            margin-bottom:20px;
            border-radius:6px;
            text-align:center;
        }

    </style>
</head>
<body>

<div class="register-wrapper">

    <!-- LEFT SIDE -->
    <div class="left-side">
        <img src="{% static 'images/logo.png' %}" alt="Logo">
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-side">
        <h2>Register User</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="success-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label>Password</label>
                {{ form.password }}
            </div>

            <div class="form-group">
                <label>Role</label>
                {{ form.role }}
            </div>

            <button type="submit" class="register-btn">Register User</button>
        </form>
    </div>
</div>
</body>
</html>
